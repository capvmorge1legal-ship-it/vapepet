name: build
# Проверочная сборка для веток (не main): собирает VapePet.exe и кладёт в артефакты, релиз не делает.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        shell: powershell
        run: |
          dotnet publish VapePet.csproj -c Release -o dist --nologo
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item installer\* dist -Force
          Get-ChildItem dist | Format-Table Name, Length
      - name: Render test (кадры GDI+ и Skia)
        shell: powershell
        run: |
          $p = Start-Process dist\VapePet.exe -ArgumentList '--render-test', "$pwd\frames" -PassThru -Wait
          Get-Content frames\log.txt
          Compress-Archive -Path frames\* -DestinationPath frames.zip
      - uses: actions/upload-artifact@v4
        with:
          name: VapePet
          path: |
            dist/VapePet.exe
            dist/install.ps1
            dist/*.cmd
      - name: Test pre-release (не попадает в автообновление)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.ref_name }}
          name: Тестовая сборка ${{ github.ref_name }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: |
            dist/VapePet.exe
            frames.zip
