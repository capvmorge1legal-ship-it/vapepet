name: release
# Релиз выпускается сам, когда в main меняется код: версия берётся из AppVersion в src/VapePet.cs.
# Если релиз с такой версией уже есть — ничего не делает.
on:
  push:
    branches: [main]
    paths: ['src/**', 'build/**', 'installer/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: ver
        shell: powershell
        run: |
          $m = Select-String -Path src\VapePet.cs -Pattern 'AppVersion = "([0-9.]+)"' | Select-Object -First 1
          $v = $m.Matches[0].Groups[1].Value
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $exists = $false
          try { Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/v$v" | Out-Null; $exists = $true } catch { }
          "exists=$exists" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build VapePet.exe
        if: steps.ver.outputs.exists != 'True'
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File build\build.ps1
          if (-not (Test-Path dist\VapePet.exe)) { exit 1 }
          Compress-Archive -Path dist\* -DestinationPath VapePet-install.zip
      - name: Publish release
        if: steps.ver.outputs.exists != 'True'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: VapePet ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/VapePet.exe
            VapePet-install.zip
